<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Portal Theme Switcher</title>
    <link rel="stylesheet" href="style.css">
</head>
<body id="app-container">
    <header>
        <button id="theme-toggle">
            Switch to Dark Mode
        </button>
    </header>

    <main>
        <div class="card component-1">
            <h2>Welcome to the KL Student Portal!</h2>
            <p>This is the main dashboard component. Notice how the background and text color changes when you toggle the theme.</p>
            <p>Your current theme is: <span id="current-theme-status">Light</span></p>
        </div>

        <div class="card component-2">
            <h3>Course Announcements</h3>
            <ul>
                <li>Midterm results are published.</li>
                <li>Assignment 3 is due next week.</li>
            </ul>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 KL Student Portal</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
